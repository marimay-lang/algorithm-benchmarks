name: Checkpoint 21 Linux x86_64 baseline

on:
  push:
    branches:
      - main
    paths:
      - ".gitea/workflows/cp21-baseline.yml"
      - "benchmarks/**"
      - "go/**"
      - "ruda/**"
      - "rust/**"
      - "verify.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    name: Linux x86_64 raw baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out benchmark corpus
        uses: actions/checkout@v4
        with:
          path: ruda-algotithms
          persist-credentials: true

      - name: Check out Ruda compiler
        env:
          RUDA_CHECKOUT_KEY: ${{ secrets.RUDA_CHECKOUT_KEY }}
        run: |
          baseline_key_dir="${RUNNER_TEMP:-/tmp}/ruda-checkout"
          install -d -m 700 "$baseline_key_dir"
          printf '%s\n' "$RUDA_CHECKOUT_KEY" >"$baseline_key_dir/id_ed25519"
          chmod 600 "$baseline_key_dir/id_ed25519"
          printf '%s\n' \
            '[gitea.example.invalid]:2222 ssh-ed25519 ARCHIVED_HOST_KEY_REMOVED' \
            >"$baseline_key_dir/known_hosts"
          GIT_SSH_COMMAND="ssh -i $baseline_key_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$baseline_key_dir/known_hosts" \
            git clone --branch main --depth 1 \
              ssh://git@gitea.example.invalid:2222/OS/Ruda.git Ma
          rm -- "$baseline_key_dir/id_ed25519" "$baseline_key_dir/known_hosts"
          rmdir "$baseline_key_dir"

      - name: Install toolchains
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential clang cmake python3

      - name: Install Go 1.26 toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Build release Ruda compiler and runtime
        run: |
          cmake -S Ma -B Ma/build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DRUDA_WARNINGS_AS_ERRORS=ON
          cmake --build Ma/build/release --parallel

      - name: Verify faithful corpus and harness tests
        working-directory: ruda-algotithms
        run: RUDA="$(cd ../Ma && pwd)/build/release/ruda" ./verify.sh

      - name: Collect focused probes
        working-directory: ruda-algotithms
        run: >-
          RUDA="$(cd ../Ma && pwd)/build/release/ruda"
          ./benchmarks/probes.py
          --samples 11
          --warmups 3
          --output benchmarks/results/cp21-probes-linux-x86_64.json

      - name: Collect algorithm corpus
        working-directory: ruda-algotithms
        run: >-
          RUDA="$(cd ../Ma && pwd)/build/release/ruda"
          ./benchmarks/run.py
          --languages ruda,go,rust
          --samples 11
          --warmups 3
          --output benchmarks/results/cp21-algorithms-linux-x86_64.md

      - name: Validate reports and derive review candidate
        working-directory: ruda-algotithms
        run: >-
          ./benchmarks/derive_budget.py
          benchmarks/results/cp21-probes-linux-x86_64.json
          benchmarks/results/cp21-algorithms-linux-x86_64.json
          --output benchmarks/budgets/cp21-linux-x86_64.json

      - name: Preserve every raw sample and candidate budget
        uses: actions/upload-artifact@v3
        with:
          name: cp21-linux-x86_64-${{ gitea.sha }}
          path: |
            ruda-algotithms/benchmarks/results/cp21-probes-linux-x86_64.json
            ruda-algotithms/benchmarks/results/cp21-algorithms-linux-x86_64.json
            ruda-algotithms/benchmarks/results/cp21-algorithms-linux-x86_64.md
            ruda-algotithms/benchmarks/budgets/cp21-linux-x86_64.json
          if-no-files-found: error

      - name: Publish candidate evidence branch
        working-directory: ruda-algotithms
        env:
          EVIDENCE_BRANCH: evidence/cp21-linux-x86_64-${{ gitea.sha }}
        run: |
          git config user.name "Gitea Actions"
          git config user.email "actions@marimay.invalid"
          git switch -c "$EVIDENCE_BRANCH"
          git add \
            benchmarks/results/cp21-probes-linux-x86_64.json \
            benchmarks/results/cp21-algorithms-linux-x86_64.json \
            benchmarks/results/cp21-algorithms-linux-x86_64.md \
            benchmarks/budgets/cp21-linux-x86_64.json
          git commit -m "Collect checkpoint 21 Linux x86_64 candidate"
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
