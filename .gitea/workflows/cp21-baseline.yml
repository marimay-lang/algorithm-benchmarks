name: Linux x86_64 benchmark regression

on:
  push:
    branches:
      - main
    paths:
      - ".gitea/workflows/cp21-baseline.yml"
      - "benchmarks/**"
      - "go/**"
      - "marimay/**"
      - "rust/**"
      - "verify.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    name: CP30 algorithms, probes, and dynamic text
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out benchmark corpus
        uses: actions/checkout@v4
        with:
          path: algorithm-benchmarks
          persist-credentials: true

      - name: Check out Marimay compiler
        env:
          MMAY_CHECKOUT_KEY: ${{ secrets.RUDA_CHECKOUT_KEY }}
        run: |
          if [ -z "$MMAY_CHECKOUT_KEY" ]; then
            echo "Marimay compiler checkout key is not configured" >&2
            exit 1
          fi
          baseline_key_dir="${RUNNER_TEMP:-/tmp}/marimay-checkout"
          install -d -m 700 "$baseline_key_dir"
          printf '%s\n' "$MMAY_CHECKOUT_KEY" >"$baseline_key_dir/id_ed25519"
          chmod 600 "$baseline_key_dir/id_ed25519"
          printf '%s\n' \
            '[gitea.example.invalid]:2222 ssh-ed25519 ARCHIVED_HOST_KEY_REMOVED' \
            >"$baseline_key_dir/known_hosts"
          GIT_SSH_COMMAND="ssh -i $baseline_key_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$baseline_key_dir/known_hosts" \
            git clone --branch main --depth 1 \
              ssh://git@gitea.example.invalid:2222/Marimay/marimay.git marimay
          rm -- "$baseline_key_dir/id_ed25519" "$baseline_key_dir/known_hosts"
          rmdir "$baseline_key_dir"

      - name: Install toolchains
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential clang cmake python3

      - name: Install Go 1.26 toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install Rust 1.96 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - name: Build release Marimay compiler and runtime
        run: |
          cmake -S marimay -B marimay/build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DMMAY_WARNINGS_AS_ERRORS=ON
          cmake --build marimay/build/release --parallel

      - name: Verify faithful corpus and harness tests
        working-directory: algorithm-benchmarks
        run: MMAY="$(cd ../marimay && pwd)/build/release/mmay" ./verify.sh

      - name: Collect focused probes
        working-directory: algorithm-benchmarks
        run: >-
          MMAY="$(cd ../marimay && pwd)/build/release/mmay"
          ./benchmarks/probes.py
          --samples 11
          --warmups 3
          --output benchmarks/results/cp30-probes-linux-x86_64.json

      - name: Collect algorithm corpus
        working-directory: algorithm-benchmarks
        run: >-
          MMAY="$(cd ../marimay && pwd)/build/release/mmay"
          ./benchmarks/run.py
          --languages marimay,go,rust
          --samples 11
          --warmups 3
          --output benchmarks/results/cp30-algorithms-linux-x86_64.md

      - name: Collect dynamic-text feature candidate
        working-directory: algorithm-benchmarks
        run: >-
          MMAY="$(cd ../marimay && pwd)/build/release/mmay"
          ./benchmarks/feature_probes.py
          --feature dynamic-text
          --samples 11
          --warmups 3
          --output benchmarks/results/cp30-dynamic-text-linux-x86_64.json

      - name: Validate reports against reviewed budgets
        working-directory: algorithm-benchmarks
        run: >-
          ./benchmarks/validate_results.py
          benchmarks/results/cp30-probes-linux-x86_64.json
          benchmarks/results/cp30-algorithms-linux-x86_64.json
          --baseline benchmarks/results/cp21-algorithms-linux-x86_64.json

      - name: Preserve every raw sample
        uses: actions/upload-artifact@v3
        with:
          name: cp30-linux-x86_64-${{ gitea.sha }}
          path: |
            algorithm-benchmarks/benchmarks/results/cp30-probes-linux-x86_64.json
            algorithm-benchmarks/benchmarks/results/cp30-algorithms-linux-x86_64.json
            algorithm-benchmarks/benchmarks/results/cp30-algorithms-linux-x86_64.md
            algorithm-benchmarks/benchmarks/results/cp30-dynamic-text-linux-x86_64.json
          if-no-files-found: error

      - name: Publish CP30 evidence branch
        working-directory: algorithm-benchmarks
        env:
          EVIDENCE_BRANCH: evidence/cp30-linux-x86_64-${{ gitea.sha }}
        run: |
          git config user.name "Gitea Actions"
          git config user.email "actions@marimay.invalid"
          git switch -c "$EVIDENCE_BRANCH"
          git add \
            benchmarks/results/cp30-probes-linux-x86_64.json \
            benchmarks/results/cp30-algorithms-linux-x86_64.json \
            benchmarks/results/cp30-algorithms-linux-x86_64.md \
            benchmarks/results/cp30-dynamic-text-linux-x86_64.json
          git commit -m "Collect checkpoint 30 Linux x86_64 evidence"
          git push origin "HEAD:refs/heads/$EVIDENCE_BRANCH"
