name: CP41 dedicated runner preflight

# This short gate prevents a full baseline on a runner without usable counters.

on:
  push:
    branches:
      - evidence/cp41-linux-x86_64
    paths:
      - ".gitea/workflows/cp41-runner-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    name: Linux x86_64 hardware-counter preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out benchmark corpus
        uses: actions/checkout@v4

      - name: Install performance tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            linux-perf python3 util-linux

      - name: Record dedicated-host identity
        run: |
          uname -a
          lscpu
          cat /proc/sys/kernel/perf_event_paranoid
          cat /proc/loadavg
          nproc

      - name: Require stable hardware counters
        run: |
          perf --version
          for attempt in 1 2 3; do
            perf stat -x, \
              -e cycles,instructions,branches,branch-misses,cache-references,cache-misses \
              -- taskset -c 0 python3 -c 'total = 0
for value in range(10000000):
    total += value
assert total == 49999995000000'
          done
